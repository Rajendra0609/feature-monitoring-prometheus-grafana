apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-root
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: prod-observability-v2
    app.kubernetes.io/component: app-of-apps
  annotations:
    # Docs: https://argo-cd.readthedocs.io/en/stable/operator-manual/cluster-bootstrapping/
    argocd.argoproj.io/description: "Root App of Apps — manages all observability child Applications"
  finalizers:
    - resources-finalizer.argocd.argoproj.io   # deletes child apps on root deletion
spec:
  project: observability

  source:
    repoURL: "REPLACE_WITH_YOUR_REPO_URL"   # e.g. https://github.com/YOUR_ORG/prod-observability-v2.git
    targetRevision: HEAD                     # or pin to a branch/tag: main, v1.0.0
    path: argocd/apps                        # ArgoCD watches this folder for child Applications

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd                        # child Application objects live in argocd namespace

  syncPolicy:
    automated:
      prune: true       # delete Applications removed from Git
      selfHeal: true    # revert manual changes in the cluster
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=false   # namespaces are managed by observability-namespaces app

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-ingress-nginx
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: prod-observability-v2
    app.kubernetes.io/component: ingress-nginx-metrics
  annotations:
    argocd.argoproj.io/sync-wave: "4"   # Wave 4 — metrics Service for ingress-nginx scraping
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: observability

  source:
    repoURL: "REPLACE_WITH_YOUR_REPO_URL"
    targetRevision: HEAD
    path: 03-ingress-nginx-metrics

  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx   # Service lives in ingress-nginx namespace

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=false   # ingress-nginx namespace managed by ingress-nginx chart

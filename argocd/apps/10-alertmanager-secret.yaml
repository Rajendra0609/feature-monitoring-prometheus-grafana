# Alertmanager notification credentials.
# Mounted into the pod as files (smtp_auth_password_file / slack_api_url_file)
# rather than env vars, so secrets never appear in `kubectl describe pod` output
# and never need to be inlined into the (non-secret) alertmanager-config ConfigMap.
#
# REPLACE the placeholder values below before applying.
# For production, use Sealed Secrets / External Secrets Operator / ArgoCD Vault
# Plugin instead of committing plaintext values to Git (see README Security Notes).
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-secrets
  namespace: monitoring
type: Opaque
stringData:
  # App password / SMTP auth password (e.g. a Gmail App Password, SES SMTP
  # credential, SendGrid API key used as password, etc.)
  smtp-password: "CHANGE_ME_SMTP_APP_PASSWORD"

  # Slack Incoming Webhook URL: https://api.slack.com/messaging/webhooks
  slack-webhook-url: "https://hooks.slack.com/services/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"

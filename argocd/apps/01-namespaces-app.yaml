apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-namespaces
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: prod-observability-v2
    app.kubernetes.io/component: namespaces
  annotations:
    argocd.argoproj.io/sync-wave: "0"   # Wave 0 — namespaces must exist before everything else
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: observability

  source:
    repoURL: "REPLACE_WITH_YOUR_REPO_URL"
    targetRevision: HEAD
    path: 00-namespaces

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring   # ignored for Namespace resources (cluster-scoped)

  syncPolicy:
    automated:
      prune: false        # INTENTIONALLY false — never auto-delete namespaces (data loss risk)
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=false

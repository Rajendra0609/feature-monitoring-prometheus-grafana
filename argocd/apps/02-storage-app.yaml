apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-storage
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: prod-observability-v2
    app.kubernetes.io/component: storage
  annotations:
    argocd.argoproj.io/sync-wave: "1"   # Wave 1 — StorageClass + PVs before workloads
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: observability

  source:
    repoURL: "REPLACE_WITH_YOUR_REPO_URL"
    targetRevision: HEAD
    path: 05-storage

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring   # ignored for cluster-scoped resources (StorageClass, PV)

  syncPolicy:
    automated:
      prune: false        # INTENTIONALLY false — PVs hold data; never auto-delete
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=false

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-jenkins
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: prod-observability-v2
    app.kubernetes.io/component: jenkins-integration
  annotations:
    argocd.argoproj.io/sync-wave: "4"   # Wave 4 — Jenkins namespace label + metrics Service
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: observability

  source:
    repoURL: "REPLACE_WITH_YOUR_REPO_URL"
    targetRevision: HEAD
    path: 04-jenkins-integration

  destination:
    server: https://kubernetes.default.svc
    namespace: jenkins

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=false   # jenkins namespace managed by jenkins chart

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana-allow-external
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grafana   # FIXED: was "app: grafana" — must match deployment pod labels
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0   # Allow from all IPs — restrict to known CIDR if needed
      ports:
        - port: 3000
          protocol: TCP

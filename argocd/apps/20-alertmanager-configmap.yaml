apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: prod-observability-v2
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
      # --- SMTP (edit for your provider) ---
      smtp_smarthost: 'smtp.gmail.com:587'
      smtp_from: 'alertmanager@example.com'
      smtp_auth_username: 'alertmanager@example.com'
      smtp_auth_password_file: /etc/alertmanager/secrets/smtp-password
      smtp_require_tls: true

    route:
      receiver: default-notifications
      group_by: ['alertname', 'namespace', 'severity']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        # Critical alerts -> Slack + email, paged immediately, repeat sooner
        - matchers:
            - severity = "critical"
          receiver: critical-notifications
          group_wait: 10s
          repeat_interval: 1h
        # Warning alerts -> Slack only
        - matchers:
            - severity = "warning"
          receiver: warning-notifications

    inhibit_rules:
      # Don't fire a warning for the same alertname/namespace that's already critical
      - source_matchers:
          - severity = "critical"
        target_matchers:
          - severity = "warning"
        equal: ['alertname', 'namespace']

    receivers:
      - name: default-notifications
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/slack-webhook-url
            channel: '#all-alert-manager'
            send_resolved: true
            title: '{{ .CommonAnnotations.summary }}'
            text: '{{ .CommonAnnotations.description }}'
        email_configs:
          - to: 'oncall@example.com'
            send_resolved: true

      - name: critical-notifications
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/slack-webhook-url
            channel: '#all-alert-manager'
            send_resolved: true
            title: ':rotating_light: {{ .CommonAnnotations.summary }}'
            text: '{{ .CommonAnnotations.description }}'
        email_configs:
          - to: 'oncall@example.com'
            send_resolved: true
            headers:
              Subject: '[CRITICAL] {{ .CommonAnnotations.summary }}'

      - name: warning-notifications
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/slack-webhook-url
            channel: '#all-alert-manager'
            send_resolved: true
            title: '{{ .CommonAnnotations.summary }}'
            text: '{{ .CommonAnnotations.description }}'

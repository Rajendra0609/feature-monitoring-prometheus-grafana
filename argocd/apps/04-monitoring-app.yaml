apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-monitoring
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: prod-observability-v2
    app.kubernetes.io/component: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "3"   # Wave 3 — Prometheus StatefulSet, Grafana Deployment, NetworkPolicies
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: observability

  source:
    repoURL: "REPLACE_WITH_YOUR_REPO_URL"
    targetRevision: HEAD
    path: 02-monitoring
    directory:
      recurse: true         # recurse into grafana/, prometheus/, networkpolicies/ sub-directories
      exclude: "*.sh"       # exclude any shell scripts that may be in the tree

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=false   # namespace created by observability-namespaces
      - RespectIgnoreDifferences=true

  # ── Ignore ArgoCD-injected fields that change on every sync ───────────────
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/volumeClaimTemplates   # ArgoCD may flag VCT diffs; this is expected
    - group: ""
      kind: Secret
      jsonPointers:
        - /data                        # secret data managed externally (e.g. Vault / Sealed Secrets)

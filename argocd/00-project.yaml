apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: observability
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: prod-observability-v2
spec:
  description: "Production Observability Stack — Prometheus + Grafana + Node Exporter"

  # ── Source repositories ────────────────────────────────────────────────────
  sourceRepos:
    - "REPLACE_WITH_YOUR_REPO_URL"   # e.g. https://github.com/YOUR_ORG/prod-observability-v2.git

  # ── Allowed destinations ───────────────────────────────────────────────────
  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd           # child Application resources live here
    - server: https://kubernetes.default.svc
      namespace: monitoring
    - server: https://kubernetes.default.svc
      namespace: node-metrics
    - server: https://kubernetes.default.svc
      namespace: ingress-nginx
    - server: https://kubernetes.default.svc
      namespace: jenkins
    - server: https://kubernetes.default.svc
      namespace: "*"              # cluster-scoped resources (StorageClass, PV, ClusterRole, etc.)

  # ── Cluster-scoped resources this project may manage ──────────────────────
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: storage.k8s.io
      kind: StorageClass
    - group: ""
      kind: PersistentVolume
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding

  # ── Namespaced resources — allow everything inside managed namespaces ──────
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"

  # ── Project roles ──────────────────────────────────────────────────────────
  roles:
    - name: admin
      description: Full access to the observability project
      policies:
        - p, proj:observability:admin, applications, *, observability/*, allow
      groups:
        - observability-admins   # replace with your SSO/RBAC group
